<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #D9D9D9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .reg-container {
            width: 796px;
            height: 750px; /* Высота контейнера */
            background-color: #FBFBFB;
            border-radius: 62px;
            padding: 54px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .reg-header {
            text-align: center;
            margin-bottom: 20px; /* Уменьшено с 45px */
            margin-top: -10px; /* Новое свойство */
        }

        .reg-header h2 {
            font-size: 24px;
            color: #4F4F4F;
            margin-bottom: 5px; /* Уменьшено с 9px */
        }

        .reg-header p {
            font-size: 16px;
            color: #4F4F4F;
        }

        .reg-form {
            display: flex;
            flex-direction: column;
            gap: 27px;
            flex-grow: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .form-group label {
            font-size: 16px;
            color: #4F4F4F;
            font-weight: bold;
        }

        .form-group input {
            height: 68px;
            width: 100%;
            background-color: #D9D9D9;
            border: none;
            border-radius: 9px;
            padding: 0 23px;
            font-size: 16px;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: -9px;
        }

        .show-password input {
            width: 18px;
            height: 18px;
        }

        .show-password label {
            font-size: 14px;
            color: #4F4F4F;
            font-weight: normal;
        }

        .form-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 27px;
        }

        .submit-btn {
            background-color: #4F4F4F;
            color: white;
            border: none;
            border-radius: 33px;
            height: 66px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn {
            color: #4F4F4F;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        /* Стили для flash-сообщений */
        .flash-messages {
            position: absolute;
            top: 20px;
            width: 100%;
            max-width: 796px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .flash {
            padding: 15px;
            border-radius: 9px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            animation: slideIn 0.3s ease-out;
        }

        .flash.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="reg-container">
        <div class="reg-header">
            <h2>Регистрация</h2>
            <p>Заполните все поля для создания аккаунта</p>
        </div>

        <form class="reg-form" method="POST" action="{{ url_for('auth.registration') }}">
    <div class="form-group">
        <input type="text" id="name" name="user_name" placeholder="Введите ваше ФИО" required>
    </div>

    <div class="form-group">
        <input type="text" id="position" name="job_title" placeholder="Введите вашу должность" required>
    </div>

    <div class="form-group">
        <input type="text" id="login" name="login" placeholder="Придумайте логин" required>
    </div>

    <div class="form-group">
        <input type="password" id="password" name="password" pattern = "^(?=.*\d)(?=.*[a-zA-Z])[a-zA-Z0-9]{8,}$" placeholder="Придумайте пароль" required
        title="Пароль должен содержать минимум 8 символов, 1 цифру и 1 букву">
    </div>

    <div class="form-group">
        <input type="password" id="confirm-password" name="confirm_password" pattern = "^(?=.*\d)(?=.*[a-zA-Z])[a-zA-Z0-9]{8,}$" placeholder="Повторите пароль" required>
    </div>

            <div class="show-password">
                <input type="checkbox" id="show-password">
                <label for="show-password">Показать пароль</label>
            </div>

            <div class="form-footer">
                <button type="submit" class="submit-btn">Зарегистрироваться</button>
                <a href="http://127.0.0.1:5000/" class="back-btn">Назад</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('show-password').addEventListener('change', function() {
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm-password');
            passwordInput.type = this.checked ? 'text' : 'password';
            confirmInput.type = this.checked ? 'text' : 'password';
        });
    </script>
</body>
</html>
