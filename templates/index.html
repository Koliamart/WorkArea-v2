<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма авторизации</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #D9D9D9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Стили для flash-сообщений */
        .flash-messages {
            position: absolute;
            top: 20px;
            width: 100%;
            max-width: 796px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .flash {
            padding: 15px;
            border-radius: 9px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            animation: slideIn 0.3s ease-out;
        }

        .flash.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .auth-container {
            width: 796px;
            height: 581px;
            background-color: #FBFBFB;
            border-radius: 62px;
            padding: 54px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            margin-top: 20px; /* Добавляем отступ сверху для сообщений */
        }

        .auth-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .auth-header h1 {
            font-size: 32px;
            color: #4F4F4F;
            margin-bottom: 9px;
        }

        .auth-header p {
            font-size: 16px;
            color: #4F4F4F;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 27px;
            flex-grow: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .form-group label {
            font-size: 16px;
            color: #4F4F4F;
            font-weight: bold;
        }

        .form-group input {
            height: 68px;
            background-color: #D9D9D9;
            border: none;
            border-radius: 9px;
            padding: 0 23px;
            font-size: 16px;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: -9px;
        }

        .show-password input {
            width: 18px;
            height: 18px;
        }

        .show-password label {
            font-size: 14px;
            color: #4F4F4F;
            font-weight: normal;
        }

        .form-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 27px;
        }

        .submit-btn {
            background-color: #4F4F4F;
            color: white;
            border: none;
            border-radius: 33px;
            height: 66px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-link {
            text-align: center;
        }

        .register-link a {
            color: #4F4F4F;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Блок flash-сообщений теперь позиционируется абсолютно над формой -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="auth-container">
        <div class="auth-header">
            <h1>Вход в систему</h1>
            <p>Введите ваши данные для входа</p>
        </div>

        <form class="auth-form" method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" placeholder="Введите ваш логин" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
            </div>

            <div class="show-password">
                <input type="checkbox" id="show-password">
                <label for="show-password">Показать пароль</label>
            </div>

            <div class="form-footer">
                <button type="submit" class="submit-btn">Вход</button>
                <div class="register-link">
                    <a href="{{ url_for('auth.registration') }}">Регистрация</a>
                </div>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('show-password').addEventListener('change', function() {
            const passwordInput = document.getElementById('password');
            passwordInput.type = this.checked ? 'text' : 'password';
        });

        // Автоматическое скрытие flash-сообщений через 5 секунд
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const flashes = document.querySelectorAll('.flash');
                flashes.forEach(flash => {
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 300);
                });
            }, 5000);
        });
    </script>
</body>
</html>
